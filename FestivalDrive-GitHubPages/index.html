<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111316">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.png">
<title>節日車庫</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111316;color:#f7f4ed;font-size:15px;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}main{width:min(1120px,100%);margin:auto;padding:max(24px,env(safe-area-inset-top)) clamp(16px,4vw,38px) max(24px,env(safe-area-inset-bottom))}header,.section,.foot,.tile{display:flex;align-items:center;justify-content:space-between;gap:12px}header{margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px;font-weight:750;font-size:20px}.mark{width:40px;height:40px;display:grid;place-items:center;background:#d6ee96;color:#171c12;border-radius:14px;font-size:25px}.pill,button.theme{border:1px solid #ffffff25;background:#202327;color:#fff;border-radius:100px;padding:10px 15px;font:inherit;min-height:44px}.pill[aria-pressed=true],button.theme[aria-pressed=true]{background:#d6ee96;color:#171c12;border-color:#d6ee96}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #d6ee96;outline-offset:3px}.hero{position:relative;min-height:390px;isolation:isolate;overflow:hidden;border:1px solid #ffffff2c;border-radius:30px;background:var(--scene,#253032);display:grid;align-items:center;padding:clamp(22px,6vw,67px)}canvas{position:absolute;width:100%;height:100%;inset:0;z-index:-2}.hero:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#0d1214ef,#0d12149c 35%,transparent 72%)}.hero small{letter-spacing:.12em;color:#f8f4ded9;font-size:14px}.hero h1{font-size:clamp(35px,6vw,73px);letter-spacing:-.055em;margin:12px 0 8px;line-height:1.05}.hero p{margin:0;color:#fffddd;font-size:16px}.clock{font-size:clamp(48px,9vw,90px);font-variant-numeric:tabular-nums;font-weight:250;letter-spacing:-.065em;margin-top:20px;line-height:1}.section{margin:23px 0 12px}.section h2{font-size:15px;margin:0}.section span,.foot,.tile small{color:#aeb3b9;font-size:13px}.themes{display:flex;gap:8px;flex-wrap:wrap}.car{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;margin-top:20px}.tile{padding:16px 18px;background:#1c1f22;border:1px solid #ffffff1c;border-radius:20px;min-height:72px}.tile strong{display:block;margin-bottom:4px}.tile b{font-size:26px;font-weight:500}.foot{margin-top:20px;flex-wrap:wrap}.foot input{color-scheme:dark;font:inherit;background:#202327;border:1px solid #ffffff25;border-radius:9px;padding:8px;color:white;min-height:44px}.preview{display:none}.wide .preview{display:inline}.wide .hero{min-height:260px;aspect-ratio:2.35;border:7px solid #31353a;border-left-width:26px;box-shadow:0 12px 28px #0008;align-items:center}.wide .hero:after{background:linear-gradient(90deg,#0d1214ee,transparent 75%)}.wide .clock{font-size:clamp(34px,7vw,70px);margin-top:9px}.wide .hero h1{font-size:clamp(23px,5vw,54px)}.wide .tile{background:#292d31}@media(max-width:580px){.hero{min-height:395px;align-items:start}.hero:after{background:linear-gradient(180deg,#101719e8,transparent 65%)}.hero .clock{margin-top:12px}.car{grid-template-columns:1fr 1fr}.tile{padding:13px;gap:5px}.tile b{font-size:19px}}@media(max-width:390px){header{gap:6px}.brand{font-size:17px}.pill{padding-inline:10px}.car{grid-template-columns:1fr}}
</style>
</head>
<body><main id="app">
<header><div class="brand"><span class="mark" aria-hidden="true">✦</span>節日車庫</div><button class="pill" id="preview" aria-pressed="false">車機預覽</button></header>
<section class="hero" id="hero" aria-label="節日主題"><canvas id="art" aria-hidden="true"></canvas><div><small id="date"></small><div class="clock" id="clock"></div><h1 id="title"></h1><p id="subtitle"></p></div></section>
<section aria-labelledby="themeHeading"><div class="section"><h2 id="themeHeading">主題</h2><span id="mode"></span></div><div class="themes" id="themes"></div></section>
<div class="car"><div class="tile"><div><strong id="upcoming"></strong><small id="remaining"></small></div><b aria-hidden="true">✦</b></div><div class="tile"><div><strong>台灣時間</strong><small>每次開啟自動更新主題</small></div><b id="weekday"></b></div></div>
<div class="foot"><label for="birthday">生日月日 <input id="birthday" type="date" aria-describedby="birthHint"></label><span id="birthHint">年份僅供選擇日期，主題每年重複。</span><span class="preview">車機樣式示意，旋轉手機可橫向查看。</span></div>
</main><script src="./app.js"></script></body></html>
